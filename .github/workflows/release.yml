name: Release

on:
  push:
    branches: [main, claude/epic-euler-uzxkgp]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            sep: ";"
          - os: macos-latest
            target: --mac
            sep: ":"
          - os: ubuntu-latest
            target: --linux
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests du moteur
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller
          python -m pytest -q tests

      - name: Compiler le moteur Python
        working-directory: backend
        shell: bash
        run: pyinstaller --noconfirm --onedir --name stockpulse-backend --add-data "../market_news.db${{ matrix.sep }}." --add-data "catalog${{ matrix.sep }}catalog" --add-data "catalog_sources${{ matrix.sep }}catalog_sources" --collect-submodules uvicorn main.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire l'installateur
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run build
          npx tsc -p electron/tsconfig.json
          npx electron-builder ${{ matrix.target }} --publish never

      - name: Empreintes SHA-256
        working-directory: frontend/release
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.exe *.dmg *.zip *.AppImage *.deb; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > SHA256SUMS-${{ runner.os }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StockPulse-${{ runner.os }}
          path: |
            frontend/release/*.exe
            frontend/release/*.dmg
            frontend/release/*.AppImage
            frontend/release/*.deb

      - name: Lire la version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: StockPulse ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            frontend/release/*.exe
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/*.blockmap
            frontend/release/latest*.yml
            frontend/release/SHA256SUMS-*.txt
          generate_release_notes: true
