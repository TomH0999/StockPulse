name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler le moteur Python
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onedir --name stockpulse-backend --add-data "../market_news.db;." --collect-submodules uvicorn main.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire l'installateur
        working-directory: frontend
        run: |
          npm ci
          npm run electron:build

      - uses: actions/upload-artifact@v4
        with:
          name: StockPulse-Windows
          path: frontend/release/*.exe

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/release/*.exe
          generate_release_notes: true
