name: Release Windows

on:
  push:
    branches: [main, claude/epic-euler-uzxkgp]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests du moteur
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller
          python tests/smoke_test.py

      - name: Compiler le moteur Python
        working-directory: backend
        run: |
          pyinstaller --noconfirm --onedir --name stockpulse-backend --add-data "../market_news.db;." --add-data "catalog;catalog" --collect-submodules uvicorn main.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire l'installateur
        working-directory: frontend
        run: |
          npm ci
          npm run electron:build

      - name: Empreinte SHA-256
        working-directory: frontend/release
        shell: pwsh
        run: Get-ChildItem *.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StockPulse-Windows
          path: frontend/release/*.exe

      - name: Lire la version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: StockPulse ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            frontend/release/*.exe
            frontend/release/*.blockmap
            frontend/release/latest.yml
            frontend/release/SHA256SUMS.txt
          generate_release_notes: true
