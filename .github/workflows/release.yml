name: Release Windows

on:
  push:
    branches: [main, claude/epic-euler-uzxkgp]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler le moteur Python
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onedir --name stockpulse-backend --add-data "../market_news.db;." --add-data "catalog;catalog" --collect-submodules uvicorn main.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire l'installateur
        working-directory: frontend
        run: |
          npm ci
          npm run electron:build

      - uses: actions/upload-artifact@v4
        with:
          name: StockPulse-Windows
          path: frontend/release/*.exe

      - name: Lire la version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: StockPulse ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: frontend/release/*.exe
          generate_release_notes: true
